services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports: !override
      - "${WEB_PORT:-80}:4200"
    volumes:
      - ./frontend:/src
      - web-modules:/src/node_modules
      - web-cache:/src/.angular
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"

volumes:
  web-modules:
  web-cache:

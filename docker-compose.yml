services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pharmacy
      POSTGRES_USER: pharmacy
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - pharmacy-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmacy -d pharmacy"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/pharmacy
      DB_USERNAME: pharmacy
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8088,http://127.0.0.1:8088,http://localhost:4200}
      PHARMACY_ADMIN_USERNAME: ${PHARMACY_ADMIN_USERNAME:-admin}
      PHARMACY_ADMIN_EMAIL: ${PHARMACY_ADMIN_EMAIL:-admin@pharmacy.local}
      PHARMACY_ADMIN_PASSWORD: ${PHARMACY_ADMIN_PASSWORD:?Set PHARMACY_ADMIN_PASSWORD}
      PHARMACY_ADMIN_FULL_NAME: ${PHARMACY_ADMIN_FULL_NAME:-System Administrator}
      PHARMACY_ADMIN_MUST_CHANGE_PASSWORD: ${PHARMACY_ADMIN_MUST_CHANGE_PASSWORD:-true}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pharmacy-data:
